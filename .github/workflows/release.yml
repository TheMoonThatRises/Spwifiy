name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install graphicsmagick imagemagick
          npm install --global create-dmg

      - name: Build app
        run: |
          xcodebuild \
            -project Spwifiy.xcodeproj \
            -scheme Spwifiy \
            -configuration Release \
            -derivedDataPath .build

      - name: Create dmg
        run: |
          create-dmg \
            --overwrite \
            --no-code-sign \
            --no-version-in-filename \
            .build/Build/Products/Release/Spwifiy.app \
            ./

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Spwifiy.dmg
          path: ./*.dmg
